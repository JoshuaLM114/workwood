# Example project definition. This file lives at the ROOT of a team "super-repo"
# (committed + shared) alongside a workwood/ folder (actions/ + super-features/).
# Run `workwood init` here: it back-fills `id` (the project UUID) and `name`, then
# creates each developer's own state under $WORKWOOD_DATA/workwood-state.yml.
#
# Schema:
#   id    — project UUID (filled by `workwood init`; commit it to share identity)
#   name  — canonical project name / slug (filled by init; immutable)
#   repos[].name           — directory name under main_dir and the repo name
#   repos[].default_branch — branch a base clone is parked on (and the default a
#                            new feature branch is cut from)
#   repos[].url            — the git URL to clone from (required; cloned as-is)

# Replace the placeholder clone URLs with your own repository URLs.
name: example

repos:
  - name: api
    default_branch: main
    url: git@example.invalid:team/api.git
  - name: web
    default_branch: main
    url: git@example.invalid:team/web.git
  - name: shared-lib
    default_branch: master
    url: git@example.invalid:team/shared-lib.git
