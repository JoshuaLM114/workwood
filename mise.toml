# ---------------------------------------------------------------------------
# workwood — a global CLI for orchestrating git worktrees across many repos.
#
# Projects keep workwood.yml, workwood/actions/ and super-feature manifests
# in a shared super-repo. workwood init records each project's UUID, root and
# data directory in ~/.workwood/projects.yml for local CLI/MCP discovery.
#
# This mise file only pins the Go toolchain used to build the binary:
#   go build -o bin/workwood .
#   go install .            # drops it on $PATH as `workwood`
# ---------------------------------------------------------------------------

[tools]
go = "1.26"
